{% extends "base.html" %}
{% block title %}Game Platform{% endblock %}
{% block content %}<main style="min-height:100vh;display:grid;place-items:center;background:#070d1c;color:white;font-family:system-ui"><p id="entry-status">Game Platform…</p></main>{% endblock %}
{% block scripts %}<script>
(async () => {
  const access = localStorage.getItem('access_token');
  const refresh = localStorage.getItem('refresh_token');
  if (!access && !refresh) { location.replace('/login'); return; }
  try {
    if (refresh) {
      const response = await fetch('/api/auth/refresh', {method:'POST',headers:{Authorization:'Bearer '+refresh}});
      if (response.ok) {
        const data = await response.json();
        if (data.access_token) { localStorage.setItem('access_token',data.access_token);location.replace('/lobby');return; }
      }
    }
    // Anciennes sessions : ne pas faire confiance à la seule présence du jeton.
    if (access) {
      const response = await fetch('/api/rooms',{headers:{Authorization:'Bearer '+access}});
      if (response.ok) {location.replace('/lobby');return;}
    }
  } catch (_) { document.getElementById('entry-status').textContent='Connection unavailable. Please try again.'; return; }
  localStorage.removeItem('access_token');localStorage.removeItem('refresh_token');localStorage.removeItem('user');localStorage.removeItem('auth_remember');
  location.replace('/login');
})();
</script>{% endblock %}
