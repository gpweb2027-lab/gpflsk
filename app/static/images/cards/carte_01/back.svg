<svg
    xmlns="http://www.w3.org/2000/svg"
    width="240"
    height="336"
    viewBox="0 0 240 336"
>

    <defs>

        <linearGradient
            id="background"
            x1="0"
            y1="0"
            x2="1"
            y2="1"
        >

            <stop
                offset="0%"
                stop-color="#312e81"
            />

            <stop
                offset="50%"
                stop-color="#6d28d9"
            />

            <stop
                offset="100%"
                stop-color="#1d4ed8"
            />

        </linearGradient>


        <pattern
            id="pattern"
            width="28"
            height="28"
            patternUnits="userSpaceOnUse"
        >

            <path
                d="
                    M14 2
                    L26 14
                    L14 26
                    L2 14
                    Z
                "
                fill="none"
                stroke="#ffffff"
                stroke-opacity="0.12"
                stroke-width="2"
            />

        </pattern>


        <filter id="glow">

            <feGaussianBlur
                stdDeviation="4"
                result="blur"
            />

            <feMerge>
                <feMergeNode in="blur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>

        </filter>

    </defs>


    <rect
        x="3"
        y="3"
        width="234"
        height="330"
        rx="18"
        fill="#090f20"
        stroke="#dbeafe"
        stroke-width="6"
    />


    <rect
        x="11"
        y="11"
        width="218"
        height="314"
        rx="13"
        fill="url(#background)"
    />


    <rect
        x="11"
        y="11"
        width="218"
        height="314"
        rx="13"
        fill="url(#pattern)"
    />


    <rect
        x="24"
        y="24"
        width="192"
        height="288"
        rx="12"
        fill="none"
        stroke="#c4b5fd"
        stroke-width="3"
    />


    <path
        d="
            M120 78
            L174 168
            L120 258
            L66 168
            Z
        "
        fill="#090f20"
        fill-opacity="0.45"
        stroke="#c4b5fd"
        stroke-width="4"
        filter="url(#glow)"
    />


    <path
        d="
            M120 112
            L153 168
            L120 224
            L87 168
            Z
        "
        fill="none"
        stroke="#ffffff"
        stroke-opacity="0.65"
        stroke-width="3"
    />


    <text
        x="120"
        y="190"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="70"
        fill="#ffffff"
        filter="url(#glow)"
    >
        ♠
    </text>

</svg>
